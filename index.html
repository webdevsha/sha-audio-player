<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sha's Audio Library</title>
<style>
  :root {
    --bg: #f7f9fc;
    --card: #ffffff;
    --ink: #1f2a37;
    --muted: #6b7280;
    --accent: #4f8ef7;
    --accent-soft: #e8f0fe;
    --track-hover: #f1f5fb;
    --playing: #eafaf1;
    --border: #e6eaf0;
    --shadow: 0 6px 24px rgba(31, 42, 55, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .wrap {
    width: 100%;
    max-width: 640px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  header {
    padding: 22px 24px 14px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 650;
    letter-spacing: -0.01em;
  }
  header p {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--muted);
  }
  .banner {
    display: none;
    margin: 14px 24px 0;
    padding: 10px 14px;
    background: #fff6e6;
    border: 1px solid #f3d9a4;
    border-radius: 10px;
    font-size: 13px;
    color: #8a6d2f;
  }
  .banner.show { display: block; }
  .player {
    padding: 18px 24px 6px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .play-btn {
    flex: 0 0 auto;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  .play-btn:active { transform: scale(0.94); }
  .play-btn:disabled { background: #c7d2e0; cursor: not-allowed; }
  .meta { min-width: 0; flex: 1 1 auto; }
  .now-title {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .now-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .progress {
    margin: 8px 24px 0;
    height: 8px;
    background: var(--accent-soft);
    border-radius: 999px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .progress .fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.1s linear;
  }
  .times {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    padding: 4px 24px 0;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 6px 24px 18px;
  }
  .ctrl-btn {
    background: none;
    border: none;
    color: var(--ink);
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
    line-height: 1;
  }
  .ctrl-btn:disabled { color: #c7d2e0; cursor: not-allowed; }
  .vol { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .vol input { width: 90px; accent-color: var(--accent); }
  ul.list {
    list-style: none;
    margin: 0;
    padding: 6px 12px 18px;
    max-height: 320px;
    overflow-y: auto;
  }
  ul.list li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.12s ease;
  }
  ul.list li:hover { background: var(--track-hover); }
  ul.list li.playing { background: var(--playing); }
  .idx {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  li.playing .idx { background: var(--accent); color: #fff; }
  .t-info { min-width: 0; flex: 1 1 auto; }
  .t-title { font-size: 14px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-date { font-size: 12px; color: var(--muted); }
  .status { padding: 0 24px 18px; font-size: 12px; color: var(--muted); }
  .notes {
    padding: 4px 24px 8px;
  }
  .notes-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-soft);
    color: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin: 6px 0 0;
  }
  .notes-toggle:active { transform: scale(0.97); }
  .notes-body {
    display: none;
    margin-top: 12px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  .notes-body.open { display: block; }
  .notes-body h3 {
    font-size: 13px;
    font-weight: 700;
    margin: 14px 0 6px;
    color: var(--ink);
    letter-spacing: 0.01em;
  }
  .notes-body h3:first-child { margin-top: 0; }
  .notes-body ul { margin: 0; padding-left: 18px; }
  .notes-body li { font-size: 13px; line-height: 1.5; color: #374151; margin-bottom: 7px; }
  audio { display: none; }
  footer { padding: 0 24px 20px; font-size: 11px; color: #9aa3b2; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 id="lib-title">Sha's Audio Library</h1>
      <p id="lib-sub">Streaming from R2 &middot; big files welcome</p>
    </header>
    <div class="banner" id="banner"></div>
    <div class="player">
      <button class="play-btn" id="playBtn" disabled aria-label="Play / Pause">&#9658;</button>
      <div class="meta">
        <div class="now-title" id="nowTitle">Select a track</div>
        <div class="now-sub" id="nowSub">&nbsp;</div>
      </div>
    </div>
    <div class="progress" id="progress"><div class="fill" id="fill"></div></div>
    <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    <div class="controls">
      <button class="ctrl-btn" id="prevBtn" title="Previous" disabled>&#9198;</button>
      <button class="ctrl-btn" id="nextBtn" title="Next" disabled>&#9197;</button>
      <div class="vol">
        <span aria-hidden="true">&#128266;</span>
        <input type="range" id="vol" min="0" max="1" step="0.01" value="1" aria-label="Volume" />
      </div>
    </div>
    <div class="status" id="status">Loading library&hellip;</div>
    <ul class="list" id="list"></ul>
    <div class="notes" id="notes" hidden>
      <button class="notes-toggle" id="notesToggle" aria-expanded="false">&#9776; Show notes &amp; reflections</button>
      <div class="notes-body" id="notesBody"></div>
    </div>
    <footer>Add future tracks by editing <code>manifest.json</code> &mdash; no code changes needed.</footer>
  </div>
  <audio id="audio" preload="metadata"></audio>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const audio = $("audio");
  let tracks = [];
  let current = -1;

  function fmt(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ":" + (s < 10 ? "0" : "") + s;
  }
  function resolve(base, file) {
    return base.replace(/\/+$/, "") + "/" + file.replace(/^\/+/, "");
  }

  async function loadManifest() {
    try {
      const res = await fetch("manifest.json", { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      tracks = Array.isArray(data.tracks) ? data.tracks : [];
      if (data.title) $("lib-title").textContent = data.title;
      if (!data.baseUrl || data.baseUrl.includes("REPLACE-WITH-YOUR-BUCKET")) {
        showBanner("Set your R2 bucket URL in manifest.json → baseUrl (e.g. https://my-bucket.r2.dev).");
      }
      window.__baseUrl = data.baseUrl || "";
      render();
    } catch (e) {
      $("status").textContent = "Could not load manifest.json: " + e.message;
    }
  }

  function showBanner(msg) {
    const b = $("banner");
    b.textContent = msg;
    b.classList.add("show");
  }

  function render() {
    const list = $("list");
    list.innerHTML = "";
    if (!tracks.length) {
      $("status").textContent = "No tracks found in manifest.json.";
      return;
    }
    $("status").textContent = tracks.length + " track" + (tracks.length > 1 ? "s" : "") + " loaded.";
    tracks.forEach((t, i) => {
      const li = document.createElement("li");
      li.dataset.i = i;
      li.innerHTML =
        '<div class="idx">' + (i + 1) + '</div>' +
        '<div class="t-info"><div class="t-title"></div><div class="t-date"></div></div>';
      li.querySelector(".t-title").textContent = t.title || ("Track " + (i + 1));
      li.querySelector(".t-date").textContent = t.date || "";
      li.addEventListener("click", () => select(i));
      list.appendChild(li);
    });
    $("prevBtn").disabled = false;
    $("nextBtn").disabled = false;
  }

  function renderNotes(t) {
    const wrap = $("notes");
    const body = $("notesBody");
    const n = t && t.notes;
    if (!n || (!n.mainPoints && !n.reflections && !n.insightfulPoints)) {
      wrap.hidden = true;
      body.innerHTML = "";
      return;
    }
    wrap.hidden = false;
    const sections = [
      ["Main Points", n.mainPoints],
      ["Reflections", n.reflections],
      ["Insightful Points", n.insightfulPoints]
    ];
    let html = "";
    for (const [label, items] of sections) {
      if (Array.isArray(items) && items.length) {
        html += "<h3>" + label + "</h3><ul>";
        for (const it of items) {
          const text = (typeof it === "string") ? it : (it.text || "");
          if (text) html += "<li>" + escapeHtml(text) + "</li>";
        }
        html += "</ul>";
      }
    }
    body.innerHTML = html;
    body.classList.remove("open");
    $("notesToggle").setAttribute("aria-expanded", "false");
    $("notesToggle").innerHTML = "&#9776; Show notes &amp; reflections";
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function select(i) {
    if (i < 0 || i >= tracks.length) return;
    current = i;
    const t = tracks[i];
    const src = window.__baseUrl ? resolve(window.__baseUrl, t.file) : t.file;
    audio.src = src;
    $("nowTitle").textContent = t.title || ("Track " + (i + 1));
    $("nowSub").textContent = t.date || src;
    document.querySelectorAll("#list li").forEach((li, idx) => {
      li.classList.toggle("playing", idx === i);
    });
    renderNotes(t);
    $("playBtn").disabled = false;
    audio.play().catch(() => {/* autoplay may be blocked; user can hit play */});
  }

  function toggle() {
    if (current < 0) { if (tracks.length) select(0); return; }
    if (audio.paused) audio.play(); else audio.pause();
  }
  function step(d) {
    if (current < 0) return;
    const n = current + d;
    if (n >= 0 && n < tracks.length) select(n);
  }

  // Events
  $("playBtn").addEventListener("click", toggle);
  $("prevBtn").addEventListener("click", () => step(-1));
  $("nextBtn").addEventListener("click", () => step(1));
  $("notesToggle").addEventListener("click", () => {
    const body = $("notesBody");
    const open = body.classList.toggle("open");
    $("notesToggle").setAttribute("aria-expanded", open ? "true" : "false");
    $("notesToggle").innerHTML = open
      ? "&#9776; Hide notes &amp; reflections"
      : "&#9776; Show notes &amp; reflections";
  });
  audio.addEventListener("play", () => { $("playBtn").innerHTML = "&#10074;&#10074;"; });
  audio.addEventListener("pause", () => { $("playBtn").innerHTML = "&#9658;"; });
  audio.addEventListener("ended", () => step(1));
  audio.addEventListener("loadedmetadata", () => { $("dur").textContent = fmt(audio.duration); });
  audio.addEventListener("timeupdate", () => {
    const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
    $("fill").style.width = pct + "%";
    $("cur").textContent = fmt(audio.currentTime);
  });
  audio.addEventListener("error", () => {
    $("nowSub").textContent = "Playback error — browser can't decode this codec. Use AAC (.m4a) or MP3, not ALAC.";
  });
  $("vol").addEventListener("input", (e) => { audio.volume = parseFloat(e.target.value); });
  $("progress").addEventListener("click", (e) => {
    if (!audio.duration) return;
    const r = e.currentTarget.getBoundingClientRect();
    audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
  });
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;
    if (e.code === "Space") { e.preventDefault(); toggle(); }
    else if (e.code === "ArrowRight") step(1);
    else if (e.code === "ArrowLeft") step(-1);
  });

  loadManifest();
})();
</script>
</body>
</html>
